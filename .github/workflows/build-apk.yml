name: Verify and build Android

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run check
      - run: git diff --exit-code -- app/src/main/assets/vendor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Gradle wrapper
        run: echo '0336f591bc0ec9aa0c9988929b93ecc916b3c1d52aed202c7381db144aa0ef15  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Android lint and tests
        run: ./gradlew lintDebug testDebugUnitTest
      - name: Build development artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: ./gradlew assembleDebug
      - name: Upload development APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: XingyunFortune-debug-not-for-release
          path: app/build/outputs/apk/debug/*.apk
      - name: Prepare stable signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" && test -n "$CERT_SHA256"
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test "$GITHUB_REF_NAME" = "v$version"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build signed release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Verify signing identity
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          signer="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$signer" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/signature.txt"
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature.txt" | tr '[:upper:]' '[:lower:]' | tr -d ': ')
          expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ': ')
          test -n "$actual" && test "$actual" = "$expected"
          asset="XingyunFortune-$GITHUB_REF_NAME.apk"
          cp "$apk" "$asset"
          sha256sum "$asset" > SHA256SUMS.txt
      - name: Upload verified release files
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: |
            XingyunFortune-v*.apk
            SHA256SUMS.txt
            RELEASE_NOTES.md
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  publish:
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-release
      - name: Publish only the verified tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "XingyunFortune-$GITHUB_REF_NAME.apk" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --verify-tag --title "星运灵签 $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
