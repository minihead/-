name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.4

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XingyunFortune-APK
        path: app/build/outputs/apk/debug/*.apk

    - name: Prepare Release Asset
      run: |
        cp app/build/outputs/apk/debug/*.apk ./XingyunFortune.apk
        cp app/build/outputs/apk/debug/*.apk ./LingyunFortune.apk

    - name: Publish to Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cat << 'NOTES' > release_notes.md
        《星运灵签》v1.0.6 首页底部遮挡彻底修复与全屏安全边距自适应版：
        1. 核心修复【首页底部遮挡操作按钮】：重构滚动视口与底部悬浮磨砂 Dock 的层叠交互，新增物理级 Screen Bottom Spacer 占位垫片，当页面滚动至底端时，运势卡生成按钮与底部 Dock 保持至少 64px 极度舒适的净空距离，彻底消除任何遮挡与误触。
        2. 原生适配 Android 系统导航栏：接入 WindowCompat 与 ViewCompat.setOnApplyWindowInsetsListener，动态监听全面屏手势栏与经典三键导航栏（Back/Home/Recents）的像素高度，实时同步至 WebView CSS 变量，确保底部 Dock 与系统按键永不重叠冲突。
        3. 全量模块按钮排版加固：对【灵签】摇签筒、【运势】生成专属签卡、【塔罗】3D切牌抽取、【祈福】点灯升空全部四大核心主交互按钮施加同等安全垫片与层级加固。
        4. 全机型全分辨率屏幕 100% 完美可见与触控：不管是高刷曲面屏、直板长屏还是传统比例手机，运势卡片、分析雷达与操作按钮全部顺畅滑动且无遮挡。
        NOTES

        gh release upload v1.0.0 ./LingyunFortune.apk --clobber || true
        gh release upload v1.0.1 ./LingyunFortune.apk --clobber || true
        gh release upload v1.0.2 ./LingyunFortune.apk --clobber || true
        gh release upload v1.0.3 ./XingyunFortune.apk ./LingyunFortune.apk --clobber || true
        gh release upload v1.0.4 ./XingyunFortune.apk ./LingyunFortune.apk --clobber || true
        gh release upload v1.0.5 ./XingyunFortune.apk ./LingyunFortune.apk --clobber || true
        gh release create v1.0.6 ./XingyunFortune.apk ./LingyunFortune.apk --title "星运灵签 v1.0.6 首页底部遮挡彻底修复与安全边距自适应版" --notes-file release_notes.md || (gh release upload v1.0.6 ./XingyunFortune.apk --clobber && gh release upload v1.0.6 ./LingyunFortune.apk --clobber)
