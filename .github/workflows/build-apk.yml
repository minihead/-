name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.4

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XingyunFortune-APK
        path: app/build/outputs/apk/debug/*.apk

    - name: Prepare Release Asset
      run: |
        cp app/build/outputs/apk/debug/*.apk ./XingyunFortune.apk
        cp app/build/outputs/apk/debug/*.apk ./LingyunFortune.apk

    - name: Publish to Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload v1.0.0 ./LingyunFortune.apk --clobber || true
        gh release upload v1.0.1 ./LingyunFortune.apk --clobber || true
        gh release upload v1.0.2 ./LingyunFortune.apk --clobber || true
        gh release create v1.0.3 ./XingyunFortune.apk ./LingyunFortune.apk --title "星运灵签 v1.0.3 沉浸式本地全功能版" --notes "《星运灵签》v1.0.3 依照最新产品需求规范 (PRD) 全面重构发布：纯本地离线运行、传感器物理摇签(100灵签)、十二星座与生肖老黄历双轨运势推演、个人生辰命盘配置、78张塔罗直觉切牌3D翻牌、祈福明灯心愿森林与单机暖心弹幕、120fps极致丝滑动画、原生Canvas高精海报排版与原生一键分享。" || (gh release upload v1.0.3 ./XingyunFortune.apk --clobber && gh release upload v1.0.3 ./LingyunFortune.apk --clobber)
