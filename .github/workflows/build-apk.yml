name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.4

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XingyunFortune-APK
        path: app/build/outputs/apk/debug/*.apk

    - name: Prepare Release Asset
      run: |
        cp app/build/outputs/apk/debug/*.apk ./XingyunFortune.apk
        cp app/build/outputs/apk/debug/*.apk ./LingyunFortune.apk

    - name: Publish to Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cat << 'NOTES' > release_notes.md
        《星运灵签》v1.0.5 运势大盘首页重构与生肖星轨全量动态版：
        1. 默认首页升级为【今日运势】：打开即入高定双轨运势大盘，底部悬浮磨砂晶体 Dock 默认高亮【运势】，灵签/塔罗/祈福并列随心切换。
        2. 十二星座全动态能量引擎：彻底解决“仅显示天蝎座”问题，白羊至双鱼十二星座完整动态演算（综合/灵感/事业/情感四维雷达、契合星座、能量宝石、天象合轴、灵修避坑穿搭全维度解析）。
        3. 十二生肖专属运势全面恢复与强化：老黄历面板植入鼠至猪12生肖横向滑轨，一键切换专属岁运流转、四维指数、三合六合贵人、冲犯提醒与处事锦囊。
        4. 融合万年老黄历与十二时辰吉凶全览：子丑寅卯辰巳午未申酉戌亥全时辰吉凶表（当前时辰高亮）、建除十二神、五行纳音、彭祖百忌与胎神占方。
        5. 彻底消除界面空旷感：黄金比例卡片排版、三相时令能量流转、自适应系统农历与干支时间同步，打造顶级光学晶体质感。
        NOTES

        gh release upload v1.0.0 ./LingyunFortune.apk --clobber || true
        gh release upload v1.0.1 ./LingyunFortune.apk --clobber || true
        gh release upload v1.0.2 ./LingyunFortune.apk --clobber || true
        gh release upload v1.0.3 ./XingyunFortune.apk ./LingyunFortune.apk --clobber || true
        gh release upload v1.0.4 ./XingyunFortune.apk ./LingyunFortune.apk --clobber || true
        gh release create v1.0.5 ./XingyunFortune.apk ./LingyunFortune.apk --title "星运灵签 v1.0.5 运势大盘首页与生肖星轨全量动态版" --notes-file release_notes.md || (gh release upload v1.0.5 ./XingyunFortune.apk --clobber && gh release upload v1.0.5 ./LingyunFortune.apk --clobber)
